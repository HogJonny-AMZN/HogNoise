# pyproject.toml: the workspace root. It builds nothing (Docs/standards/layout.md): the library is the member in
# packages/python/hog-noise/, with its own manifest. This file holds the workspace, the dev group and the tools.
[tool.uv.workspace]
members = ["packages/python/*"]

[dependency-groups]
# The group the template's `make sync` and CI install: the library with every extra, so a fresh clone prepares the whole
# suite.
dev = [
    "hog-noise[fast,reference,sheets]",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv.sources]
hog-noise = { workspace = true }

# =========================================================================
# Code Quality Tools
# =========================================================================
[tool.ruff]
line-length = 120
# The library floor: Maya 2026+ is Python 3.11. Nothing newer than 3.11 syntax in library code.
target-version = "py311"
indent-width = 4
src = ["tools", "tests", "apps/*/src", "packages/*/*/src"]
exclude = [".venv", "__pycache__", "Spikes"]

[tool.ruff.lint]
# The template's rule set; E501 stays on: the formatter does not wrap strings or docstrings.
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.format]
# Records carried from the source project keep their code blocks as written: an ADR is append-only, and the roadmap is history.
exclude = ["Docs/decisions/ADR-009-backend-ladder.md", "Docs/PYTHON_UPGRADE_AND_FASTNOISE.md"]
quote-style = "double"
indent-style = "space"

# =========================================================================
# Testing Configuration
# =========================================================================
[tool.pytest.ini_options]
testpaths = ["tests", "apps/*/tests", "packages/*/*/tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-ra --tb=short --strict-markers --import-mode=importlib"
pythonpath = ["tests"]
markers = [
    "slow: slow-running tests (a second process, a cache prime)",
]
