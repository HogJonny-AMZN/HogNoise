# pyproject.toml
[project]
name = "hog-noise"
version = "0.1.0.dev0"
description = "Procedural noise for Python: the FastNoiseLite and FastNoiseSIMD algorithms, checked against the originals"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [
    {name = "HogJonny"}
]
keywords = ["noise", "procedural-generation", "simplex", "perlin", "cellular", "numba", "numpy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    # The whole runtime. Every other dependency is an optional extra and every kernel has a numpy base.
    # Maya 2026 ships numpy 1.x, so the floor stays at 1.26 and CI tests both majors.
    "numpy>=1.26.0",
]

[project.optional-dependencies]
jit = [
    # Optional JIT for the kernels (hog_noise.scalar). Never required: every kernel has a numpy base.
    "numba>=0.61",
]
reference = [
    # The middle rung of the noise ladder and the oracle for its vectors (ADR-007).
    "pyfastnoiselite>=0.0.7",
]
sheets = [
    # The comparison sheets and the gallery contact sheets.
    "pillow>=10.0.0",
]
test = [
    "pytest>=7.4.0",
]
dev = [
    "hog-noise[jit,reference,sheets,test]",
    "ruff>=0.1.0",
]

[dependency-groups]
# The group the template's `make sync` and CI install: the project with every extra, so a fresh clone prepares the whole suite.
dev = [
    "hog-noise[jit,reference,sheets]",
    "pytest>=8",
    "ruff>=0.6",
]

# =========================================================================
# Build System
# =========================================================================
[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# =========================================================================
# Code Quality Tools
# =========================================================================
[tool.ruff]
line-length = 120
# The library floor: Maya 2026+ is Python 3.11. Nothing newer than 3.11 syntax in library code.
target-version = "py311"
indent-width = 4
src = ["tools", "tests", "src"]
exclude = [".venv", "__pycache__", "Spikes"]

[tool.ruff.lint]
# The template's rule set; E501 stays on: the formatter does not wrap strings or docstrings.
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.format]
# Records carried from the source project keep their code blocks as written: an ADR is append-only, and the roadmap is history.
exclude = ["Docs/decisions/ADR-009-backend-ladder.md", "Docs/PYTHON_UPGRADE_AND_FASTNOISE.md"]
quote-style = "double"
indent-style = "space"

# =========================================================================
# Testing Configuration
# =========================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-ra --tb=short --strict-markers"
markers = [
    "slow: slow-running tests (a second process, a cache prime)",
]
