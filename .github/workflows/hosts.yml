name: hosts

# The emitted shaders run in a host written from their README, on a software GPU, against the vectors (the CI proof's
# spec). spirv-naga runs on tests.yml's three GPU legs; this file holds the hosts those legs cannot run: the GLSL, and
# the HLSL and Vulkan hosts, whose C++ harnesses only this file builds, so tests.yml's legs skip them.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  glsl:
    name: GLSL on llvmpipe (Ubuntu, EGL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Mesa's OpenGL through EGL
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1-mesa-dri
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # the gpu extra too: the one job with moderngl and wgpu together, so the GL-after-wgpu test runs somewhere
          python -m pip install -e "packages/python/hog-noise[dev,gpu]" "moderngl>=5.13,<6"
          python -m pip install --no-deps -e apps/hog-noise-tools
      - name: Context
        # the spec's first open risk: a surfaceless OpenGL 4.3 context on the runner, and which renderer it is
        run: python -c "import moderngl; c = moderngl.create_standalone_context(require=430, backend='egl'); print(c.info['GL_RENDERER'], '|', c.info['GL_VERSION'])"
      - name: Adapter
        env:
          WGPU_BACKEND_TYPE: OpenGL
        # fails unless wgpu's device is on OpenGL: llvmpipe alone would also match lavapipe, Mesa's Vulkan driver
        # (P-22, as tests.yml's GPU legs)
        run: python -c "from hog_noise import gpu; i = gpu.adapter_info(); print(i); assert i['backend_type'] == 'OpenGL', i"
      - name: Test
        env:
          # fails instead of skipping when a host is missing, and unless it runs on llvmpipe: spirv-naga too,
          # which runs here through wgpu's OpenGL back end, pinned, the README's "OpenGL beside the GLSL"
          HOG_NOISE_REQUIRE_HOST: glsl,spirv-naga
          HOG_NOISE_HOST_TARGET: llvmpipe
          WGPU_BACKEND_TYPE: OpenGL
        # -rA: each test's outcome by name, so the log shows the GL-after-wgpu test passed, not skipped, and the
        # target each host printed
        run: pytest apps/hog-noise-tools/tests/hosts -rA

  hlsl:
    name: HLSL on WARP (Windows, D3D11 and D3D12)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "packages/python/hog-noise[dev]"
          python -m pip install --no-deps -e apps/hog-noise-tools
      - name: Build the harness
        # MSVC from the runner's Visual Studio: build.bat finds vcvars64.bat. The only place the harness is built.
        shell: cmd
        run: apps\hog-noise-tools\hosts\hlsl\build.bat
      - name: Test
        env:
          # fails instead of skipping when either host is missing, and unless each runs on WARP, whose adapter is
          # "Microsoft Basic Render Driver"; the line also names the API the host made its device with
          HOG_NOISE_REQUIRE_HOST: hlsl-d3d11,hlsl-d3d12
          HOG_NOISE_HOST_TARGET: Microsoft Basic Render Driver
        # -n 0: one process, so FXC compiles the five entry points once per host, not once per worker; -rA names each
        # test's outcome, so the log shows both hosts passed and not skipped
        run: pytest apps/hog-noise-tools/tests/hosts -rA -n 0

  spirv-vulkan:
    name: SPIR-V on lavapipe (Ubuntu, Vulkan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Mesa's Vulkan driver, the loader and a compiler
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan-dev vulkan-tools g++
      - name: Devices
        # what the loader finds: lavapipe is the CPU device, "llvmpipe (LLVM ...)", the name the GLSL job's OpenGL has
        run: vulkaninfo --summary
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "packages/python/hog-noise[dev]"
          python -m pip install --no-deps -e apps/hog-noise-tools
      - name: Build the harness
        # g++ against the loader: the only place the harness is built
        run: sh apps/hog-noise-tools/hosts/vulkan/build.sh
      - name: Test
        env:
          # fails instead of skipping when the host is missing, and unless it runs on llvmpipe. The harness is Vulkan
          # alone and opens only a CPU device, so llvmpipe here is lavapipe; its target line names the Vulkan version
          HOG_NOISE_REQUIRE_HOST: spirv-vulkan
          HOG_NOISE_HOST_TARGET: not-lavapipe
        run: pytest apps/hog-noise-tools/tests/hosts -rA -n 0
