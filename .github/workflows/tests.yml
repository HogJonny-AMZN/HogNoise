name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The library floor: Maya 2026 ships Python 3.11 and numpy 1.x.
          - {name: "3.11 + numpy 1.26 (floor)", os: ubuntu-latest, python: "3.11", numpy: "numpy==1.26.*", extras: "dev"}
          # The edge: newest Python the package admits, newest numpy.
          - {name: "3.13 + latest numpy", os: ubuntu-latest, python: "3.13", numpy: "numpy", extras: "dev"}
          # The self-contained claim: numpy is the only runtime dependency, so the suite must pass with no extras.
          - {name: "3.13, numpy only (no numba, no binding)", os: ubuntu-latest, python: "3.13", numpy: "numpy", extras: "test"}
          - {name: "3.13 on Windows", os: windows-latest, python: "3.13", numpy: "numpy", extras: "dev"}
          # The wgpu rung on a software adapter: Direct3D 12's WARP, and Mesa's llvmpipe Vulkan driver. A missing wgpu or
          # adapter fails the GPU tests here (HOG_NOISE_REQUIRE_GPU) instead of skipping them.
          - {name: "3.13 + wgpu on WARP (Windows)", os: windows-latest, python: "3.13", numpy: "numpy", extras: "dev,gpu", gpu: true}
          - {name: "3.13 + wgpu on llvmpipe (Ubuntu)", os: ubuntu-latest, python: "3.13", numpy: "numpy", extras: "dev,gpu", gpu: true}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Software Vulkan driver
        if: matrix.gpu && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # The library is the workspace member; the root is a virtual workspace and installs nothing itself.
          python -m pip install -e "packages/python/hog-noise[${{ matrix.extras }}]" "${{ matrix.numpy }}"
      - name: Adapter
        if: matrix.gpu
        run: python -c "from hog_noise import gpu; print(gpu.adapter_info())"
      - name: Test
        env:
          HOG_NOISE_REQUIRE_GPU: ${{ matrix.gpu && '1' || '0' }}
        run: pytest
      - name: Measure the wgpu rung
        if: matrix.gpu
        env:
          # a pull_request run checks out a merge commit; the record names the branch head the owner can check out
          HOG_NOISE_MEASURED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          HOG_NOISE_MEASURE_HOST: ci-${{ runner.os == 'Windows' && 'windows' || 'ubuntu' }}
        run: python tools/measure_gpu.py run --out measured
      - name: Keep the measurement
        if: matrix.gpu
        uses: actions/upload-artifact@v4
        with:
          name: gpu-measurement-${{ runner.os }}
          path: measured/
