# Weekly dependency pull requests. Each one goes through CI like any other change, which is the point: a bump that
# breaks the suite is found by the gate, not by a user.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    # The lock only: never a declared requirement. HogNoise's floors are the oldest DCC host's (Python 3.11, numpy
    # 1.26), and Dependabot rewrote a declared floor twice (PR #28, #47). Docs/standards/compatibility-matrix-project.md.
    versioning-strategy: "lockfile-only"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:15"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
